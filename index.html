<body>

  <!-- Add your site or application content here -->

  <script>
    function getComputerChoice() {
      const choice = Math.random();
      if (choice <= 1 / 3) {
        return "rock";
      } else if (choice <= 2 / 3) {
        return "paper";
      } else {
        return "scissors";
      }
    }

    function getHumanChoice() {
      const choice = prompt("Enter your choice from rock, paper and scissors");
      return choice === null ? "" : choice; // Cancel returns null, so use "" instead
    }

    function playGame() {
      let humanScore = 0;
      let computerScore = 0;

      function playRound(humanChoice, computerChoice) {
        humanChoice = humanChoice.trim().toLowerCase(); // case-insensitive

        if (
          humanChoice !== "rock" &&
          humanChoice !== "paper" &&
          humanChoice !== "scissors"
        ) {
          console.log("Invalid choice, no point awarded.");
        } else if (humanChoice === computerChoice) {
          console.log(`It's a tie! You both chose ${humanChoice}.`);
        } else if (
          (humanChoice === "rock" && computerChoice === "scissors") ||
          (humanChoice === "paper" && computerChoice === "rock") ||
          (humanChoice === "scissors" && computerChoice === "paper")
        ) {
          humanScore++;
          console.log(`You win! ${humanChoice} beats ${computerChoice}.`);
        } else {
          computerScore++;
          console.log(`You lose! ${computerChoice} beats ${humanChoice}.`);
        }
      }

      for (let i = 0; i < 5; i++) {
        // Call the choice functions every round to get fresh choices
        const humanSelection = getHumanChoice();
        const computerSelection = getComputerChoice();
        playRound(humanSelection, computerSelection);
        console.log(`Score: You ${humanScore} - Computer ${computerScore}`);
      }

      if (humanScore > computerScore) {
        console.log("You won the game!");
      } else if (computerScore > humanScore) {
        console.log("The computer won the game.");
      } else {
        console.log("The game is a tie.");
      }
    }

    playGame();

  </script>

</body>
