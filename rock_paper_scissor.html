<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

<h1>Rock Paper Scissors</h1>
<p>First to 5 points wins.</p>

<button id="rock">rock</button>
<button id="paper">paper</button>
<button id="scissors">scissors</button>

<div id="result"></div>
<div id="score">Score: You 0 - Computer 0</div>
<div id="winner"></div>

<script>
  // Scores are global so they survive between button clicks
  let humanScore = 0;
  let computerScore = 0;
  const WINNING_SCORE = 5;

  const buttons = document.querySelectorAll("button");
  const resultDiv = document.getElementById("result");
  const scoreDiv = document.getElementById("score");
  const winnerDiv = document.getElementById("winner");

  function getComputerChoice() {
    const choice = Math.random();
    if (choice <= 1 / 3) {
      return "rock";
    } else if (choice <= 2 / 3) {
      return "paper";
    } else {
      return "scissors";
    }
  }

  function playRound(humanChoice, computerChoice) {
    if (humanChoice === computerChoice) {
      resultDiv.textContent = `It's a tie! You both chose ${humanChoice}.`;
    } else if (
            (humanChoice === "rock" && computerChoice === "scissors") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissors" && computerChoice === "paper")
    ) {
      humanScore++;
      resultDiv.textContent = `You win! ${humanChoice} beats ${computerChoice}.`;
    } else {
      computerScore++;
      resultDiv.textContent = `You lose! ${computerChoice} beats ${humanChoice}.`;
    }

    scoreDiv.textContent = `Score: You ${humanScore} - Computer ${computerScore}`;
    checkWinner();
  }

  function checkWinner() {
    if (humanScore === WINNING_SCORE) {
      winnerDiv.textContent = "You won the game!";
      endGame();
    } else if (computerScore === WINNING_SCORE) {
      winnerDiv.textContent = "The computer won the game.";
      endGame();
    }
  }

  function endGame() {
    // Disable the buttons so no more rounds can be played
    buttons.forEach((button) => {
      button.disabled = true;
    });
  }


  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      playRound(button.id, getComputerChoice());
    });
  });
</script>

</body>

</html>
